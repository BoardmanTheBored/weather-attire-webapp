<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Attire</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- Main screen: every part below is filled in by render.js from the recommendation state -->
  <main id="screen-main" class="screen" aria-labelledby="main-title">
    <h1 id="main-title" class="visually-hidden">Weather Attire</h1>

    <header class="header">
      <ul id="header-icons" class="header-icons"></ul>
      <!-- Opens the location and date sheet (checkpoint C6) -->
      <button id="header-block" class="header-block" type="button" aria-haspopup="dialog"></button>
    </header>

    <div class="body">
      <section id="character-area" class="character-area" aria-label="Suggested outfit"></section>
      <section class="breakdown" aria-labelledby="breakdown-title">
        <h2 id="breakdown-title">Weather Breakdown</h2>
        <div id="breakdown-content" aria-live="polite"></div>
      </section>
    </div>

    <!-- 7-day strip: laptop layout only (hidden on phones) -->
    <nav id="week-strip" class="week-strip" aria-label="7-day forecast"></nav>

    <footer class="footer">
      <a href="#/info" class="footer-link">About this app</a>
    </footer>
  </main>

  <!-- Location and date sheet: a bottom sheet on phones, a centered dialog on laptops.
       Native <dialog> traps focus while open and restores it to the header block on close. -->
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <div class="sheet-top">
      <h2 id="sheet-title">Location and date</h2>
      <button id="sheet-close" type="button" class="btn">Close</button>
    </div>

    <form id="search-form" class="search-form">
      <label for="search-input">City or ZIP code</label>
      <div class="search-row">
        <input id="search-input" type="text" name="q" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <button id="search-button" type="submit" class="btn btn-primary">Search</button>
      </div>
    </form>

    <button id="use-location" type="button" class="btn btn-wide">Use my location</button>
    <p id="sheet-message" class="sheet-message" role="status"></p>

    <fieldset id="date-picker" class="date-picker">
      <legend>Date</legend>
      <div id="date-options" class="date-options"></div>
    </fieldset>
  </dialog>

  <!-- Information screen: reached via hash route #/info -->
  <main id="screen-info" class="screen" aria-labelledby="info-title" hidden>
    <a href="#/" class="back-link">&larr; Back</a>
    <h1 id="info-title">About this app</h1>
    <p>Information screen (placeholder)</p>
  </main>
</body>
</html>
